name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "main"
      - "develop"

jobs:
  build-and-test:
    name: Run build with unit test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
            node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Lint code
        run: npm run lint
      - name: Build project
        run: npm run build
      - name: Unit test
        run: npm run test
      - name: Upload coverage report to Github
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage
      - name: Upload coverage report to Coveralls
        #v2.3.7
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          flag-name: coverage-report-${{ matrix.node-version }}
          parallel: true

  coverage-finished:
    name: Publish coverage report to Coveralls
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        #v2.3.7
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          parallel-finished: true
          carryforward: "coverage-report-22.x,coverage-report-24.x"

  analyze:
    name: Analyze code with CodeQL
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3

  sonarcloud:
    name: Analyze code with SonarQube
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-22.x
          path: coverage

      - name: SonarQube Scan
        # v7.0.0
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}